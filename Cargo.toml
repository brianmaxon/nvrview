[workspace]
resolver = "3"
members = ["crates/*", "tools/bc-cli", "tools/mock-nvr", "tools/sign-update", "tools/simtime", "tools/soak"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/brianmaxon/nvrview"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Audio DSP (decoding, resampling) and its multi-hour simulations run in
# every `cargo test`; unoptimized they are too slow to be useful.
# Dependencies keep line tables only (backtraces still show files and
# lines); our own crates keep full debug info. Keeps target/ several GB
# smaller per checkout.
[profile.dev.package."*"]
debug = "line-tables-only"

[profile.dev.package.audio-pipeline]
opt-level = 2

[profile.dev.package.symphonia-codec-aac]
opt-level = 2

[profile.dev.package.symphonia-core]
opt-level = 2

# The 64-bit offset tests move a few GiB of (sparse) media through the
# faststart copy.
[profile.dev.package.mp4-remux]
opt-level = 2

# Sound analysis runs on every live tile with audio, and its detector tests
# push minutes of synthetic audio through it.
[profile.dev.package.sound-events]
opt-level = 2

# The mock encrypts and the session decrypts every media message; the
# cipher's generic code is slow unoptimized.
[profile.dev.package.aes]
opt-level = 2

[profile.dev.package.cfb-mode]
opt-level = 2

[profile.dev.package.cipher]
opt-level = 2

[profile.dev.package.crypto-common]
opt-level = 2

[profile.dev.package.hybrid-array]
opt-level = 2

[profile.dev.package.inout]
opt-level = 2

# The shipped library and every check build the release profile. Cargo's
# default ("thin local" LTO across a crate's 16 code generation units)
# is most of the optimizer's time: measured on a Windows laptop (8 cores),
# the cold release build of the library and the mock took 216 s by default and
# 98 to 118 s with LTO off (19.6 s instead of 23.4 s on an Apple silicon Mac).
# The cost is cross-unit inlining: the synthetic soak (4 tiles, audio, 1
# simulated hour; tools/soak) used 16.2 s of CPU by default, 18.5 s with LTO
# off and 17.2 s with the hot decode crates below on one unit, which is
# about 0.1% of one core at real time either way. One unit per hot crate keeps
# their inlining where the work is.
[profile.release]
lto = "off"

[profile.release.package.audio-pipeline]
codegen-units = 1

[profile.release.package.sound-events]
codegen-units = 1

[profile.release.package.symphonia-core]
codegen-units = 1

[profile.release.package.symphonia-codec-aac]
codegen-units = 1

[profile.release.package.mp4-remux]
codegen-units = 1

[profile.release.package.bc-protocol]
codegen-units = 1
