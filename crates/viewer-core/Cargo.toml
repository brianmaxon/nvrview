[package]
name = "viewer-core"
version = "0.1.0"
description = "The nvrview core behind the C interface: devices, tiles, per-tile pipelines and delivery threads, control events, and logging"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# Smart alerts: the rules engine (src/alerts_owner).
alerts = { path = "../alerts" }
audio-pipeline = { path = "../audio-pipeline" }
bc-protocol = { path = "../bc-protocol" }
bc-session = { path = "../bc-session" }
# Live and call recordings (src/capture_owner): the pure base and the muxer.
capture = { path = "../capture" }
mp4-remux = { path = "../mp4" }
discovery = { path = "../discovery" }
# Recorded video: index, incidents, thumbnails, downloads (src/recordings_owner).
recordings = { path = "../recordings" }
# Update checks and downloads (src/update.rs).
updates = { path = "../updates" }
crossbeam-queue = "0.3.8"
# Layouts are JSON the app passes in; they are parsed and validated with a
# real parser (src/store.rs).
serde_json = "1"
sound-events = { path = "../sound-events" }
video-pipeline = { path = "../video-pipeline" }
viewer-log = { path = "../viewer-log" }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

# The host clock (src/clock.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Performance", "Win32_Storage_FileSystem"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
mock-nvr = { path = "../../tools/mock-nvr" }
# Tests that run the core on a simulated clock (`CoreConfig::test_runtime`).
simtime = { path = "../../tools/simtime" }
tokio = { version = "1", features = ["test-util"] }
# Tests parse every event with a real JSON parser; the core itself writes
# its few small events by hand (see src/json.rs).
serde_json = "1"
tempfile = "3"
viewer-log = { path = "../viewer-log" }

[lints]
workspace = true
