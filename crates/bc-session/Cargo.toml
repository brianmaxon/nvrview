[package]
name = "bc-session"
version = "0.1.0"
description = "Async (tokio) device sessions for the Baichuan protocol: login, keepalive, per-channel previews, and non-stacking reconnect"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
bc-protocol = { path = "../bc-protocol" }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
mock-nvr = { path = "../../tools/mock-nvr" }
# test-util: tests run on a paused clock (`start_paused`), the device on
# the same clock (`mock_nvr::spawn_in`).
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true

# One test executable per crate (each links the whole dependency graph); each
# file under tests/ is a module of it, named as the file was.
[[test]]
name = "main"
path = "tests/main.rs"
