[package]
name = "recordings"
version = "0.1.0"
description = "Recorded video for nvrview: a local per-device index of recordings and events, incident grouping, and a resumable background download scheduler"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
bc-protocol = { path = "../bc-protocol" }
bc-session = { path = "../bc-session" }
mp4-remux = { path = "../mp4" }
sound-events = { path = "../sound-events" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }

[dev-dependencies]
mock-nvr = { path = "../../tools/mock-nvr" }
tempfile = "3"
# test-util: the end-to-end tests run on a paused clock.
tokio = { version = "1", features = ["time", "sync", "rt", "macros", "rt-multi-thread", "test-util"] }

[lints]
workspace = true

# One test executable per crate (each links the whole dependency graph); each
# file under tests/ is a module of it, named as the file was.
[[test]]
name = "main"
path = "tests/main.rs"
