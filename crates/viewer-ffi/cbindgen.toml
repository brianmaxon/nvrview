# cbindgen settings for include/nvrview.h. Regenerate with
# scripts/gen-header.sh; the reference is docs/nvrview.h.
language = "C"
include_guard = "NVRVIEW_H"
header = """/*
 * nvrview core C interface. Contract: docs/FFI.md.
 *
 * Generated by cbindgen from crates/viewer-ffi/src/lib.rs
 * (scripts/gen-header.sh); do not edit. It keeps the names, values,
 * layouts, and comments of the reference, docs/nvrview.h.
 */"""
cpp_compat = true
style = "both"
usize_is_size_t = true
no_includes = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
documentation_style = "doxy"
sort_by = "None"

[export]
# Used only through the integer aliases below; emit them anyway.
include = ["NvStreamTier", "NvDecodeFailure"]
# Integers received from C, shown in the header as the enum they carry.
exclude = ["NvStreamTierValue", "NvDecodeFailureValue"]

[export.rename]
"NvStreamTierValue" = "NvStreamTier"
"NvDecodeFailureValue" = "NvDecodeFailure"

[fn]
sort_by = "None"
