[package]
name = "viewer-ffi"
version = "0.1.0"
description = "The nvrview C interface (header: include/nvrview.h, generated by cbindgen)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

[lib]
# libnvrview.a (macOS XCFramework), nvrview.dll + import library (Windows),
# and an rlib for the Rust tests.
name = "nvrview"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# The JSON of nv_playback_open's request and answer.
serde_json = "1"
viewer-core = { path = "../viewer-core" }

[dev-dependencies]
# Recording-store times and answers for the recordings functions' tests.
bc-protocol = { path = "../bc-protocol" }
mock-nvr = { path = "../../tools/mock-nvr" }
# The MP4 box reader of its tests, for the capture functions' files.
mp4-remux = { path = "../mp4" }
simtime = { path = "../../tools/simtime" }
tempfile = "3"
# Signed update folders for the update functions' tests.
updates = { path = "../updates" }

[lints]
workspace = true

# One test executable per crate (each links the whole dependency graph); each
# file under tests/ is a module of it, named as the file was.
[[test]]
name = "main"
path = "tests/main.rs"
