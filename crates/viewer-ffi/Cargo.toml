[package]
name = "viewer-ffi"
version = "0.1.0"
description = "The nvrview C interface (header: include/nvrview.h, generated by cbindgen)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
# libnvrview.a (macOS XCFramework), nvrview.dll + import library (Windows),
# and an rlib for the Rust tests.
name = "nvrview"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
viewer-core = { path = "../viewer-core" }

[dev-dependencies]
# Recording-store times and answers for the recordings functions' tests.
bc-protocol = { path = "../bc-protocol" }
mock-nvr = { path = "../../tools/mock-nvr" }
serde_json = "1"
simtime = { path = "../../tools/simtime" }
tempfile = "3"
# Signed update folders for the update functions' tests.
updates = { path = "../updates" }

[lints]
workspace = true
