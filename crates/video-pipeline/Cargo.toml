[package]
name = "video-pipeline"
version = "0.1.0"
description = "Sans-I/O per-tile decoder decisions for nvrview: keyframe gating, backpressure, recovery, parameter-set parsing, color matrices, and grid layout"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lints]
workspace = true

# One test executable per crate (each links the whole dependency graph); each
# file under tests/ is a module of it, named as the file was.
[[test]]
name = "main"
path = "tests/main.rs"
