[package]
name = "alerts"
version = "0.1.0"
description = "Sans-I/O smart-notification rules engine for nvrview: triggers, gate, rules, night from sunrise and sunset, episodes and cooldowns, external-trigger confirmation, and explained decisions"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
autotests = false

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_json = "1"

[lints]
workspace = true

# One test executable per crate (each links the whole dependency graph); each
# file under tests/ is a module of it, named as the file was.
[[test]]
name = "main"
path = "tests/main.rs"
