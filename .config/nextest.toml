# Per-test time limits for `cargo nextest run` (scripts/check.sh and the
# Windows worker). The slowest tests legitimately take about 25 seconds on a
# busy development machine (the long simulated-time audio runs and one
# playback test), so a test is reported as slow after 30 seconds and killed,
# and failed by name, after 120 seconds: about five times the slowest. A hang
# fails fast instead of holding up the whole check.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 4 }
