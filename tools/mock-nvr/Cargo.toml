[package]
name = "mock-nvr"
version = "0.1.0"
description = "A fake Reolink-style NVR for tests and development: handshake, login, keepalive, channel info, and looping synthetic live video"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
autotests = false

[dependencies]
bc-protocol = { path = "../../crates/bc-protocol" }
# The server runs on tokio: on a runtime of its own in real time, or on a
# test's runtime and (paused) clock (`spawn_in`).
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros"] }

[dev-dependencies]
# The tests run the mock on a simulated clock.
simtime = { path = "../simtime" }

[lints]
workspace = true

# One test executable per crate (each links the whole dependency graph); each
# file under tests/ is a module of it, named as the file was.
[[test]]
name = "main"
path = "tests/main.rs"
