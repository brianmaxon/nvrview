[package]
name = "bc-cli"
version = "0.1.0"
description = "Command-line client: find devices on the LAN, log in to an NVR, list its channels, and record one live channel to an Annex-B file"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
bc-protocol = { path = "../../crates/bc-protocol" }
bc-session = { path = "../../crates/bc-session" }
discovery = { path = "../../crates/discovery" }
viewer-core = { path = "../../crates/viewer-core" }
serde_json = "1"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-util", "io-std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "env-filter"] }

[dev-dependencies]
mock-nvr = { path = "../mock-nvr" }
# The tests run on a paused clock.
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"

[lints]
workspace = true
