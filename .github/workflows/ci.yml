name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sanitization patterns
        run: python3 -I scripts/check-sanitized.py --all
      - name: Secret scan (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --redact --no-banner

  # Skips itself until the Cargo workspace exists.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('Cargo.toml') != ''
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: hashFiles('Cargo.toml') != ''
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: hashFiles('Cargo.toml') != ''
      - run: cargo test --workspace
        if: hashFiles('Cargo.toml') != ''
      # The C interface as apps link it: static library and shared library
      # (nvrview.dll plus its import library on Windows).
      - name: Build the C interface library
        run: cargo build --release -p viewer-ffi
      - name: Check the C interface artifacts (Linux)
        if: runner.os == 'Linux'
        run: ls -l target/release/libnvrview.a target/release/libnvrview.so
      - name: Check the C interface artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: ls -l target/release/nvrview.lib target/release/nvrview.dll target/release/nvrview.dll.lib
      - name: C smoke test against mock-nvr (Linux)
        if: runner.os == 'Linux'
        run: scripts/test-c-ffi.sh
      # The C# bindings (apps/windows) against the library just built:
      # struct layouts and constants as the platform's C compiler sees the
      # header, then the smoke test against mock-nvr (apps/windows/README.md).
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: C# bindings smoke test against mock-nvr
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
          NVRVIEW_TEST_PASSWORD: example-password
        run: |
          set -euo pipefail
          cargo build --release -p mock-nvr
          # Relative paths (build/ is git-ignored) keep Windows drive-letter
          # paths out of bash.
          out=build/csharp
          mkdir -p "$out"
          if [ "$RUNNER_OS" = Windows ]; then
            # clang targets the MSVC ABI the DLL is built for.
            command -v clang >/dev/null || PATH="/c/Program Files/LLVM/bin:$PATH"
            cc=clang exe=.exe lib=target/release/nvrview.dll
          else
            cc=cc exe='' lib=target/release/libnvrview.so
          fi
          "$cc" -std=c11 -Wall -Wextra -Werror -I crates/viewer-ffi/include \
            apps/windows/layout/nvlayout.c -o "$out/nvlayout$exe"
          "$out/nvlayout$exe" >"$out/layout.txt"
          dotnet build apps/windows/NvrView.Smoke -c Release --artifacts-path "$out/artifacts"
          dotnet "$out/artifacts/bin/NvrView.Smoke/release/NvrView.Smoke.dll" \
            --mock-nvr "target/release/mock-nvr$exe" --fixtures fixtures/synthetic \
            --lib "$lib" --layout "$out/layout.txt" \
            --header crates/viewer-ffi/include/nvrview.h
      # The Windows video layer (apps/windows/NvrView.Video) on WARP with
      # CPU decoding, checked by reading rendered pixels back: hosted runners
      # have no GPU and no HEVC Video Extension, so H.264 only. Not required
      # until a run confirms Media Foundation's H.264 decoder on the runner
      # image; the GPU path runs on a local Windows computer
      # (scripts/windows-worker.sh).
      - name: Windows video self-test (WARP, CPU decoding)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: bash
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
          NVRVIEW_TEST_PASSWORD: example-password
        run: scripts/csharp-video-selftest.sh --ci

  # The committed header must be what cbindgen generates from the source.
  header:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cbindgen
      - run: scripts/gen-header.sh --check
