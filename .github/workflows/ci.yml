name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Sanitization patterns
        run: python3 -I scripts/check-sanitized.py --all
      - name: Secret scan (full history)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --redact --no-banner

  # Skips itself until the Cargo workspace exists.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('Cargo.toml') != ''
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: hashFiles('Cargo.toml') != ''
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: hashFiles('Cargo.toml') != ''
      - run: cargo test --workspace
        if: hashFiles('Cargo.toml') != ''
